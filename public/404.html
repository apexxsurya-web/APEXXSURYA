<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX SURYA — Redirecting...</title>
    <style>
      body {
        margin: 0;
        background-color: #070709;
        color: #f4f4f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(239, 68, 68, 0.2);
        border-top-color: #ef4444;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function() {
        // Calculate the base path for GitHub Pages or custom domain
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        // If hosted at username.github.io/repo/, redirect to /repo/
        // If hosted at custom domain or username.github.io/, redirect to /
        var targetBase = '/';
        if (segments.length > 0 && window.location.hostname.includes('github.io')) {
          targetBase = '/' + segments[0] + '/';
        }
        window.location.replace(targetBase + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="loader"></div>
      <p style="font-size: 13px; letter-spacing: 0.1em; color: #a1a1aa; text-transform: uppercase;">
        Redirecting to APEX SURYA...
      </p>
    </div>
  </body>
</html>
