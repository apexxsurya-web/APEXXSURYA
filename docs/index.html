    <script>
      // Capture script/asset loading errors
      window.addEventListener('error', function(e) {
        var el = document.getElementById('loading-diag');
        if (el) {
          el.style.display = 'block';
          var text = document.getElementById('loading-diag-text');
          if (text) {
            var target = e.target;
            if (target && target.src) {
              text.textContent = 'Asset not found (404): ' + target.src;
            } else if (e.message) {
              text.textContent = e.message;
            }
          }
        }
      }, true);
    </script>
    <script type="module" crossorigin src="./assets/index-DGoI_jqS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BrXVs2M4.css">

  <body class="bg-[#070709] text-[#f4f4f7] font-['Plus_Jakarta_Sans',sans-serif] selection:bg-red-600/30 selection:text-white antialiased overflow-x-hidden" style="background-color: #070709; color: #f4f4f7;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #070709; color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 440px;">
          <div style="width: 32px; height: 32px; border: 2px solid rgba(239, 68, 68, 0.2); border-top-color: #ef4444; border-radius: 50%; animation: initial-spin 0.8s linear infinite;"></div>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #71717a;">APEX SURYA</span>

          <div id="loading-diag" style="display:none; margin-top: 18px; padding: 18px; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 12px; font-size: 13px; line-height: 1.6; color: #d4d4d8;">
            <p id="loading-diag-text" style="color: #f87171; font-weight: 600; font-family: monospace; font-size: 12px; margin-bottom: 10px; word-break: break-all;"></p>
            <p style="margin-bottom: 12px; color: #a1a1aa; font-size: 12px;">
              If hosting on GitHub Pages, make sure your GitHub repository settings are set to deploy via <strong>GitHub Actions</strong> (or the <strong>gh-pages</strong> branch), so the compiled static site is served instead of raw source code.
            </p>
            <button onclick="location.reload()" style="padding: 7px 16px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;">
              Reload Page
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Watchdog: If the main app hasn't mounted in 4 seconds, show diagnostic helper
      setTimeout(function() {
        if (!document.getElementById('main-content')) {
          var diag = document.getElementById('loading-diag');
          if (diag) {
            diag.style.display = 'block';
            var text = document.getElementById('loading-diag-text');
            if (text && !text.textContent) {
              text.textContent = 'App bundle took longer than expected to load.';
            }
          }
        }
      }, 4000);
    </script>
    <style>
      @keyframes initial-spin { to { transform: rotate(360deg); } }
    </style>
  </body>
